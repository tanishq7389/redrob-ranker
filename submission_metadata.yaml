ai_usage_summary: |
  Used Claude as a coding assistant for architecture discussion and code review.
  All scoring weights, feature design, and disqualifier logic were designed by
  the team based on careful reading of the JD and signals doc.
  No candidate data was fed to any LLM. The ranking step is pure Python
  with no external API calls.

methodology_summary: |
  Multi-signal scoring system across 8 dimensions derived from deep JD reading.
  Key insight: the JD has explicit disqualifiers (consulting-only careers,
  non-technical titles, wrong domain like CV/Speech without NLP) that we
  implement as hard multipliers, not soft weights — ensuring they actually fire.
  Core skill scoring checks production evidence in career narratives, not just
  skill list keywords. Behavioral signals (recency, response rate, notice period,
  GitHub) act as an availability multiplier. Honeypot detection flags impossible
  timelines and suppresses them. No embeddings, no LLMs, no GPU — pure Python,
  ~50s runtime for 100K candidates. Reasoning is generated per-candidate from
  actual profile facts, rank-consistent in tone, and honest about concerns.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
